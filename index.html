// ===================== Comptes =====================
// Accès simple par identifiant / mot de passe (contrôle d'accès basique).
// Les comptes sont stockés dans le storage partagé afin que l'admin puisse les gérer
// depuis l'interface (créer / modifier / supprimer), pour tous les utilisateurs de l'outil.
const DEFAULT_ACCOUNTS = [
  { login: "admin", password: "Qualite@2026", role: "admin", name: "Administrateur" },
  { login: "Tahina", password: "zLkcpNmsLG", role: "user", name: "Tahina" },
  { login: "Tahiry", password: "WiIBpGI78o", role: "user", name: "Tahiry" },
  { login: "Martinah", password: "kc88Llkq2N", role: "user", name: "Martinah" },
  { login: "Hasina", password: "10uKHwVfXB", role: "user", name: "Hasina" },
  { login: "Ravaka", password: "cMNj18iR7r", role: "user", name: "Ravaka" },
  { login: "Rita", password: "eFhsHiPxsA", role: "user", name: "Rita" },
  { login: "Katie", password: "OeUNYw9n9x", role: "user", name: "Katie" },
  { login: "Voahanginiaina", password: "TXAlMXQBhh", role: "user", name: "Voahanginiaina" },
  { login: "Iary", password: "epKOgcHajm", role: "user", name: "Iary" }
];
let ACCOUNTS = [];
let accountsReady = null;
  
async function loadAccounts(){
  let stored = await safeGet('accounts', true);
  if (!stored || !Array.isArray(stored) || !stored.length){
    stored = DEFAULT_ACCOUNTS;
    await safeSet('accounts', stored, true);
  }
  ACCOUNTS = stored;
  return ACCOUNTS;
}
async function ensureAccountsLoaded(){
  if (!accountsReady) accountsReady = loadAccounts();
  return accountsReady;
}
async function saveAccounts(){
  await safeSet('accounts', ACCOUNTS, true);
}

let currentUser = null;

function applyRoleUI(){
  const isAdmin = currentUser && currentUser.role === 'admin';
  document.getElementById('dashboardBtn').style.display = currentUser ? 'inline-block' : 'none';
  document.getElementById('accountsBtn').style.display = isAdmin ? 'inline-block' : 'none';
  document.getElementById('sessionInfo').innerHTML = currentUser ? `Connecté : <b>${currentUser.name}</b> (${currentUser.role})` : '';
  showView('form');
}

async function attemptLogin(){
  await ensureAccountsLoaded();
  const login = document.getElementById('loginInput').value.trim();
  const pwd = document.getElementById('passwordInput').value;
  const errEl = document.getElementById('loginError');
  const acc = ACCOUNTS.find(a => a.login.toLowerCase() === login.toLowerCase() && a.password === pwd);
  if (!acc){
    errEl.textContent = "Identifiant ou mot de passe incorrect.";
    return;
  }
  currentUser = acc;
  await safeSet('session', { login: acc.login });
  document.getElementById('loginOverlay').style.display = 'none';
  document.getElementById('appWrap').style.display = 'block';
  applyRoleUI();
}

document.getElementById('loginBtn').addEventListener('click', attemptLogin);
document.getElementById('passwordInput').addEventListener('keydown', e => { if (e.key === 'Enter') attemptLogin(); });
document.getElementById('logoutBtn').addEventListener('click', async () => {
  currentUser = null;
  await safeDelete('session');
  document.getElementById('appWrap').style.display = 'none';
  document.getElementById('loginOverlay').style.display = 'flex';
  document.getElementById('loginInput').value = '';
  document.getElementById('passwordInput').value = '';
  document.getElementById('loginError').textContent = '';
});

async function restoreSession(){
  await ensureAccountsLoaded();
  const sess = await safeGet('session');
  if (sess){
    const acc = ACCOUNTS.find(a => a.login === sess.login);
    if (acc){
      currentUser = acc;
      document.getElementById('loginOverlay').style.display = 'none';
      document.getElementById('appWrap').style.display = 'block';
      applyRoleUI();
      return;
    }
  }
  document.getElementById('loginOverlay').style.display = 'flex';
  document.getElementById('appWrap').style.display = 'none';
}

  { id: "personnalisation", titre: "Personnalisation", detail: "Observer la manière dont le conseiller gère les critiques, réclamations, demandes de responsable, clients mécontents ou agressifs : maintien du calme, reconnaissance des attentes, recherche de solutions, préservation du respect mutuel et de la relation client." },

function drawGauge(pct){
  const wrap = document.getElementById('gaugeWrap');
  const hasScore = pct !== null;
  const value = hasScore ? Math.round(pct) : 0;
  const r = 62, c = 2*Math.PI*r;
  const offset = c - (value/100)*c;
  const color = !hasScore ? '#5b7d76' : value >= 80 ? '#5fd6a0' : value >= 50 ? '#f2c14e' : '#e8837a';
  wrap.innerHTML = `
    <svg viewBox="0 0 150 150" width="150" height="150">
      <circle cx="75" cy="75" r="${r}" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="12"/>
      <circle cx="75" cy="75" r="${r}" fill="none" stroke="${color}" stroke-width="12"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}"
        transform="rotate(-90 75 75)" style="transition: stroke-dashoffset .3s ease"/>
      <text x="75" y="82" text-anchor="middle" font-family="Fraunces, serif" font-size="30" font-weight="600" fill="#fff">${hasScore ? value + '%' : '—'}</text>
    </svg>`;
}

// Calcule le score en tenant compte des points et de la pénalité "Situation inacceptable"
function computeScore(){
  const counts = { conforme:0, nonconforme:0, na:0 };
  let earned = 0, possible = 0;
  CRITERIA.forEach(c => {
    const checked = document.querySelector(`input[name="${c.id}"]:checked`);
    if (!checked) return;
    const val = checked.value;
    counts[val]++;
    if (val === 'na') return; // exclu du calcul
    possible += c.points;
    if (val === 'conforme') earned += c.points;
    // 'nonconforme' rapporte 0 point sur l'item
  });
  const basePct = possible > 0 ? (earned/possible)*100 : null;
  const siSelect = document.getElementById('siSelect');
  const hasSI = siSelect ? siSelect.value === 'oui' : false;
  const finalPct = (basePct !== null && hasSI) ? basePct * 0.5 : basePct;

  document.getElementById('cntConforme').textContent = counts.conforme;
  document.getElementById('cntNonConforme').textContent = counts.nonconforme;
  document.getElementById('cntNA').textContent = counts.na;
  document.getElementById('gaugeSub').textContent = `${counts.conforme+counts.nonconforme+counts.na} / ${CRITERIA.length} critères évalués`;
  document.getElementById('pointsLine').textContent = `${earned.toFixed(1)} / ${possible.toFixed(1)} pts (avant pénalité)`;
  document.getElementById('penaltyFlag').style.display = hasSI ? 'block' : 'none';
  drawGauge(finalPct);
  return { counts, earned, possible, basePct, finalPct, hasSI };
}
listEl.addEventListener('change', computeScore);
document.getElementById('siSelect').addEventListener('change', computeScore);
computeScore();

// ---- Persistence ----
// Utilise window.storage quand disponible (environnement Claude Artifacts, stockage
// partagé entre utilisateurs). Sinon (ex : hébergement autonome type GitHub Pages, où
// window.storage n'existe pas), bascule automatiquement sur localStorage pour que
// l'enregistrement et le tableau de bord restent synchronisés dans le navigateur.
function hasCloudStorage(){
  return typeof window !== 'undefined' && !!window.storage && typeof window.storage.get === 'function';
}
function lsKey(key, shared){ return `geq_${shared ? 'shared' : 'personal'}_${key}`; }
const API_URL = "https://script.google.com/macros/s/AKfycbwYOAw0ndYVBPUvQ5nkPlxvM4R18xTd6cia57V2KZaPHURvew7B6mcRrs_8RdBvUKL4CA/exec";
async function safeGet(key) {
const response = await fetch(`${API_URL}?key=${encodeURIComponent(key)}`);
return await response.json();
}
async function safeSet(key, value) {
await fetch(API_URL, {
method: "POST",
body: JSON.stringify({
action: "save",
key: key,
value: value
})
});
}
async function safeDelete(key) {
await fetch(API_URL, {
method: "POST",
body: JSON.stringify({
action: "delete",
key: key
})
});
}

async function getAllEvaluations(){
  const index = (await safeGet('evaluations_index', true)) || [];
  const full = await Promise.all(index.map(async row => {
    const rec = await safeGet('eval:' + row.id, true);
    return rec || row;
  }));
  return full.filter(Boolean).sort((a,b) => b.savedAt - a.savedAt);
}

function scoreColor(pct){
  if (pct === null || pct === undefined) return { color:'var(--na)', bg:'var(--na-bg)' };
  if (pct >= 80) return { color:'var(--conforme)', bg:'var(--conforme-bg)' };
  if (pct >= 50) return { color:'#b5860b', bg:'#fbf1da' };
  return { color:'var(--nonconforme)', bg:'var(--nonconforme-bg)' };
}

function renderHistoryTable(evals){
  const container = document.getElementById('historyContainer');
  const isAdmin = currentUser && currentUser.role === 'admin';
  if (!evals.length){
    container.innerHTML = '<div class="empty-state">Aucune évaluation enregistrée pour le moment.</div>';
    return;
  }
  container.innerHTML = `
    <table>
      <thead><tr>
        <th>Date</th><th>Date d'appel</th><th>Agent</th><th>Évaluateur</th><th>File</th><th>Type d'écoute</th><th>Typologie</th><th>Indice</th><th>Note</th><th></th>
      </tr></thead>
      <tbody>
        ${evals.map(row => {
          const pct = row.finalPct !== undefined ? row.finalPct : row.pct;
          const label = (pct === null || pct === undefined) ? '—' : Math.round(pct) + '%';
          const sc = scoreColor(pct);
          return `<tr>
            <td>${row.date || '—'}</td>
            <td>${row.dateAppel || '—'}</td>
            <td>${row.agent || '—'}</td>
            <td>${row.evaluateur || '—'}</td>
            <td>${row.file || '—'}</td>
            <td>${row.ecoute || '—'}</td>
            <td>${row.typologie || '—'}</td>
            <td>${row.indice || '—'}</td>
            <td><span class="pill-score" style="color:${sc.color}; background:${sc.bg}">${label}</span></td>
            <td class="row-actions">
              ${isAdmin ? `<button class="btn-ghost btn-small" data-edit="${row.id}">Modifier</button>` : ''}
              ${isAdmin ? `<button class="btn-danger btn-small" data-del="${row.id}">Supprimer</button>` : ''}
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
  container.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!currentUser || currentUser.role !== 'admin'){
        alert("Seuls les comptes administrateurs peuvent supprimer une évaluation.");
        return;
      }
      const id = btn.getAttribute('data-del');
      if (!confirm("Supprimer définitivement cette évaluation ?")) return;
      const idx = (await safeGet('evaluations_index', true)) || [];
      await safeSet('evaluations_index', idx.filter(r => r.id !== id), true);
      await safeDelete('eval:' + id, true);
      await refreshDashboard();
    });
  });
  container.querySelectorAll('[data-edit]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!currentUser || currentUser.role !== 'admin'){
        alert("Seuls les comptes administrateurs peuvent modifier une évaluation.");
        return;
      }
      const id = btn.getAttribute('data-edit');
      const rec = await safeGet('eval:' + id, true);
      if (rec) loadRecordIntoForm(rec);
    });
  });
}

function loadRecordIntoForm(rec){
  editingId = rec.id;
  document.getElementById('agentInput').value = rec.agent || '';
  document.getElementById('evaluateurInput').value = rec.evaluateur || '';
  document.getElementById('dateInput').value = rec.date || '';
  document.getElementById('dateAppelInput').value = rec.dateAppel || '';
  document.getElementById('indiceInput').value = rec.indice || '';
  document.getElementById('ecouteSelect').value = rec.ecoute || 'A chaud';
  document.getElementById('fileSelect').value = rec.file || '803';
  document.getElementById('demandeInput').value = rec.demande || '';
  document.getElementById('typologieInput').value = rec.typologie || '';
  document.getElementById('siSelect').value = rec.hasSI ? 'oui' : 'non';
  document.querySelectorAll('input[type="radio"]').forEach(r => r.checked = false);
  (rec.details || []).forEach(d => {
    const crit = CRITERIA.find(c => c.titre === d.critere);
    if (crit && d.statut){
      const input = document.getElementById(`${crit.id}-${d.statut}`);
      if (input) input.checked = true;
    }
  });
  computeScore();
  document.getElementById('editBanner').style.display = 'flex';
  document.getElementById('editBannerText').textContent = `Modification de l'évaluation de ${rec.agent} du ${rec.date || '—'}.`;
  showView('form');
  window.scrollTo({top:0, behavior:'smooth'});
}

document.getElementById('saveBtn').addEventListener('click', async () => {
  const agent = document.getElementById('agentInput').value.trim();
  const evaluateur = document.getElementById('evaluateurInput').value.trim();
  const status = document.getElementById('saveStatus');
  if (!agent){
    status.textContent = "Merci de renseigner le nom de l'agent avant d'enregistrer.";
    status.style.color = 'var(--nonconforme)';
    return;
  }
  if (!evaluateur){
    status.textContent = "Merci de renseigner l'évaluateur avant d'enregistrer.";
    status.style.color = 'var(--nonconforme)';
    return;
  }
  const { counts, earned, possible, basePct, finalPct, hasSI } = computeScore();
  const id = editingId || Date.now().toString();
  const demande = document.getElementById('demandeInput').value.trim();
  const typologie = document.getElementById('typologieInput').value.trim();
  const record = {
    id,
    savedAt: editingId ? (await safeGet('eval:' + id, true))?.savedAt || Date.now() : Date.now(),
    agent,
    evaluateur,
    date: document.getElementById('dateInput').value,
    dateAppel: document.getElementById('dateAppelInput').value,
    indice: document.getElementById('indiceInput').value.trim(),
    ecoute: document.getElementById('ecouteSelect').value,
    file: document.getElementById('fileSelect').value,
    demande,
    typologie,
    createdBy: currentUser ? currentUser.login : null,
    counts, earned, possible, basePct, finalPct, hasSI,
    details: CRITERIA.map(c => ({
      critere: c.titre,
      statut: (document.querySelector(`input[name="${c.id}"]:checked`) || {}).value || null
    }))
  };
  await safeSet('eval:' + id, record, true);

  let index = (await safeGet('evaluations_index', true)) || [];
  index = index.filter(r => r.id !== id);
  index.push({ id, savedAt: record.savedAt, agent, evaluateur, date: record.date, dateAppel: record.dateAppel, ecoute: record.ecoute, file: record.file, indice: record.indice, demande: record.demande, typologie: record.typologie, finalPct: record.finalPct });
  await safeSet('evaluations_index', index, true);

  const agents = (await safeGet('agents', true)) || [];
  if (!agents.includes(agent)){ agents.push(agent); await safeSet('agents', agents, true); }
  const evaluateurs = (await safeGet('evaluateurs', true)) || [];
  if (!evaluateurs.includes(evaluateur)){ evaluateurs.push(evaluateur); await safeSet('evaluateurs', evaluateurs, true); }
  const demandes = (await safeGet('demandes', true)) || [];
  if (demande && !demandes.includes(demande)){ demandes.push(demande); await safeSet('demandes', demandes, true); }
  const typologies = (await safeGet('typologies', true)) || [];
  if (typologie && !typologies.includes(typologie)){ typologies.push(typologie); await safeSet('typologies', typologies, true); }

  status.textContent = editingId ? 'Évaluation mise à jour.' : 'Évaluation enregistrée.';
  status.style.color = 'var(--conforme)';
  editingId = null;
  document.getElementById('editBanner').style.display = 'none';
  await refreshAgentsList();
  await refreshEvaluateursList();
  await refreshDemandesList();
  await refreshTypologiesList();
  await refreshDashboard();
  setTimeout(() => status.textContent = '', 3000);
});

async function refreshDashboard(){
  let evals = await getAllEvaluations();

  // Filtre date de début / date de fin (sur la date d'évaluation), synchronisé avec tout le tableau de bord
  const dateStart = document.getElementById('dateStartFilter').value;
  const dateEnd = document.getElementById('dateEndFilter').value;
  if (dateStart) evals = evals.filter(e => e.date && e.date >= dateStart);
  if (dateEnd) evals = evals.filter(e => e.date && e.date <= dateEnd);

  // Filtre agent
  const agentSet = [...new Set(evals.map(e => e.agent).filter(Boolean))].sort();
  const filterSel = document.getElementById('agentFilter');
  const currentFilter = filterSel.value;
  filterSel.innerHTML = '<option value="">Tous les agents</option>' + agentSet.map(a => `<option value="${a}">${a}</option>`).join('');
  filterSel.value = agentSet.includes(currentFilter) ? currentFilter : '';

  // Stats globales
  const scored = evals.filter(e => (e.finalPct !== undefined && e.finalPct !== null));
  const globalAvg = scored.length ? scored.reduce((s,e) => s + e.finalPct, 0) / scored.length : null;
  document.getElementById('globalScore').textContent = globalAvg !== null ? Math.round(globalAvg) + '%' : '—';
  document.getElementById('globalCount').textContent = evals.length;
  document.getElementById('globalAgents').textContent = agentSet.length;
  document.getElementById('globalSI').textContent = evals.filter(e => e.hasSI).length;

  // Par agent
  const byAgent = {};
  agentSet.forEach(a => byAgent[a] = []);
  evals.forEach(e => { if (e.agent) (byAgent[e.agent] = byAgent[e.agent] || []).push(e); });

  const agentCardsEl = document.getElementById('agentCards');
  const agentsToShow = filterSel.value ? [filterSel.value] : agentSet;
  if (!agentsToShow.length){
    agentCardsEl.innerHTML = '<div class="empty-state">Aucun agent évalué pour le moment.</div>';
  } else {
    agentCardsEl.innerHTML = agentsToShow.map(agent => {
      const list = byAgent[agent] || [];
      const scoredList = list.filter(e => e.finalPct !== undefined && e.finalPct !== null);
      const avg = scoredList.length ? scoredList.reduce((s,e) => s + e.finalPct, 0) / scoredList.length : null;
      const sc = scoreColor(avg);

      // Critères de non-conformité (nonconforme + situation inacceptable)
      const tally = {};
      list.forEach(e => (e.details || []).forEach(d => {
        if (d.statut === 'nonconforme'){
          tally[d.critere] = (tally[d.critere] || 0) + 1;
        }
      }));
      const topIssues = Object.entries(tally).sort((a,b) => b[1]-a[1]).slice(0,5);

      return `
        <div class="agent-card">
          <div class="agent-card-head">
            <h3>${agent}</h3>
            <span class="agent-score" style="color:${sc.color}; background:${sc.bg}">${avg !== null ? Math.round(avg)+'%' : '—'}</span>
          </div>
          <div class="agent-meta">${list.length} évaluation${list.length>1?'s':''}${list.filter(e=>e.hasSI).length ? ' · ' + list.filter(e=>e.hasSI).length + ' situation(s) inacceptable(s)' : ''}</div>
          ${topIssues.length ? `<div class="noncomp-list">${topIssues.map(([crit,n]) => `<span class="noncomp-tag">${crit} (${n})</span>`).join('')}</div>` : '<div class="noncomp-list"><span class="agent-meta">Aucune non-conformité relevée</span></div>'}
        </div>`;
    }).join('');
  }

  const filtered = filterSel.value ? evals.filter(e => e.agent === filterSel.value) : evals;
  renderHistoryTable(filtered);
}
document.getElementById('agentFilter').addEventListener('change', refreshDashboard);

function genPassword(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
  let p = '';
  for (let i = 0; i < 10; i++) p += chars[Math.floor(Math.random()*chars.length)];
  return p;
}

              <button class="btn-danger btn-small" data-del-acc="${acc.login}" ${(acc.role === 'admin' && adminCount <= 1) ? 'disabled title="Impossible de supprimer le dernier compte administrateur"' : ''}>Supprimer</button>
            </td>
          </tr>`).join('')}
      </tbody>
    </table>`;

  container.querySelectorAll('[data-edit-pwd]').forEach(btn => {
    btn.addEventListener('click', async () => {
      editingPwdLogin = btn.getAttribute('data-edit-pwd');
      await renderAccountsTable();
      const field = document.getElementById('pwdEditField');
      if (field){ field.focus(); field.select(); }
    });
  });

  container.querySelectorAll('[data-gen-pwd]').forEach(btn => {
    btn.addEventListener('click', () => {
      const field = document.getElementById('pwdEditField');
      if (field) field.value = genPassword();
    });
  });

  container.querySelectorAll('[data-cancel-pwd]').forEach(btn => {
    btn.addEventListener('click', async () => {
      editingPwdLogin = null;
      await renderAccountsTable();
    });
  });

  container.querySelectorAll('[data-save-pwd]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const login = btn.getAttribute('data-save-pwd');
      const acc = ACCOUNTS.find(a => a.login === login);
      const field = document.getElementById('pwdEditField');
      if (!acc || !field) return;
      const newPwd = field.value.trim();
      if (!newPwd){
        field.style.borderColor = 'var(--nonconforme)';
        field.focus();
        return;
      }
      acc.password = newPwd;
      await saveAccounts();
      if (currentUser && currentUser.login === acc.login) currentUser = acc;
      editingPwdLogin = null;
      await renderAccountsTable();
    });
  });

  container.querySelectorAll('[data-toggle-role]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const login = btn.getAttribute('data-toggle-role');
      const acc = ACCOUNTS.find(a => a.login === login);
      if (!acc) return;
      if (acc.role === 'admin' && ACCOUNTS.filter(a => a.role === 'admin').length <= 1){
        alert("Impossible de rétrograder le dernier compte administrateur.");
        return;
      }
      const nextRole = acc.role === 'admin' ? 'user' : 'admin';
      if (!confirm(`Changer le rôle de ${acc.login} en "${nextRole === 'admin' ? 'Administrateur' : 'Utilisateur'}" ?`)) return;
      acc.role = nextRole;
      await saveAccounts();
      if (currentUser && currentUser.login === acc.login) currentUser = acc;
      await renderAccountsTable();
    });
  });

  container.querySelectorAll('[data-del-acc]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const login = btn.getAttribute('data-del-acc');
      const acc = ACCOUNTS.find(a => a.login === login);
      if (!acc) return;
      if (acc.role === 'admin' && ACCOUNTS.filter(a => a.role === 'admin').length <= 1){
        alert("Impossible de supprimer le dernier compte administrateur.");
        return;
      }
      if (currentUser && currentUser.login === acc.login){
        alert("Impossible de supprimer le compte avec lequel vous êtes actuellement connecté.");
        return;
      }
      if (!confirm(`Supprimer définitivement le compte "${acc.login}" ?`)) return;
      ACCOUNTS = ACCOUNTS.filter(a => a.login !== acc.login);
      await saveAccounts();
      await renderAccountsTable();
    });
  });
}

document.getElementById('addAccountBtn').addEventListener('click', async () => {
  const statusEl = document.getElementById('accountStatus');
  const login = document.getElementById('newAccLogin').value.trim();
  const name = document.getElementById('newAccName').value.trim() || login;
  let password = document.getElementById('newAccPassword').value.trim();
  const role = document.getElementById('newAccRole').value;

  if (!login){
    statusEl.textContent = "Merci de renseigner un identifiant.";
    statusEl.style.color = 'var(--nonconforme)';
    return;
  }
  if (ACCOUNTS.some(a => a.login.toLowerCase() === login.toLowerCase())){
    statusEl.textContent = "Cet identifiant existe déjà.";
    statusEl.style.color = 'var(--nonconforme)';
    return;
  }
  const generated = !password;
  if (!password) password = genPassword();

  ACCOUNTS.push({ login, name, password, role });
  await saveAccounts();

  document.getElementById('newAccLogin').value = '';
  document.getElementById('newAccName').value = '';
  document.getElementById('newAccPassword').value = '';
  document.getElementById('newAccRole').selectedIndex = 0;

  statusEl.style.color = 'var(--conforme)';
  statusEl.textContent = generated ? `Compte créé. Mot de passe généré : ${password}` : 'Compte créé.';
  await renderAccountsTable();
});

function csvEscape(val){
  const s = (val === null || val === undefined) ? '' : String(val);
  if (/[",;\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

async function exportEvaluationsCSV(){
  let evals = await getAllEvaluations();

  const dateStart = document.getElementById('dateStartFilter').value;
  const dateEnd = document.getElementById('dateEndFilter').value;
  if (dateStart) evals = evals.filter(e => e.date && e.date >= dateStart);
  if (dateEnd) evals = evals.filter(e => e.date && e.date <= dateEnd);

  if (!evals.length){
    alert("Aucune évaluation à exporter pour la plage de dates sélectionnée.");
    return;
  }
  const critHeaders = CRITERIA.map(c => c.titre);
  const headers = [
    "Date", "Date d'appel", "Agent", "Évaluateur", "File", "Type d'écoute", "Indice",
    "Demande client", "Typologie d'appel",
    "Note (%)", "Points obtenus", "Points possibles", "Pénalité SI appliquée",
    "Saisi par", ...critHeaders
  ];
  const rows = evals.map(e => {
    const detailsByCrit = {};
    (e.details || []).forEach(d => { detailsByCrit[d.critere] = d.statut || ''; });
    return [
      e.date || '', e.dateAppel || '', e.agent || '', e.evaluateur || '', e.file || '', e.ecoute || '', e.indice || '',
      e.demande || '', e.typologie || '',
      (e.finalPct !== undefined && e.finalPct !== null) ? Math.round(e.finalPct) : '',
      (e.earned !== undefined) ? e.earned.toFixed(1) : '',
      (e.possible !== undefined) ? e.possible.toFixed(1) : '',
      e.hasSI ? 'Oui' : 'Non',
      e.createdBy || '',
      ...critHeaders.map(h => detailsByCrit[h] || '')
    ];
  });
  const csvLines = [headers, ...rows].map(r => r.map(csvEscape).join(';'));
  const csvContent = '\uFEFF' + csvLines.join('\n');
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const rangeSuffix = (dateStart || dateEnd) ? `_${dateStart || 'debut'}_a_${dateEnd || 'fin'}` : `_${new Date().toISOString().slice(0,10)}`;
  a.download = `evaluations_qualite${rangeSuffix}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
document.getElementById('exportCsvBtn').addEventListener('click', exportEvaluationsCSV);

refreshAgentsList();
refreshEvaluateursList();
refreshDemandesList();
refreshTypologiesList();
restoreSession();
