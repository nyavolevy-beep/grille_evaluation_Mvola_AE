<script>
// ===================== Hachage des mots de passe (identique à l'outil admin) =====================
// Certains comptes (dont "admin" par défaut) restent stockés au format hérité
// (salt + passwordHash PBKDF2) tant qu'ils n'ont pas été réinitialisés en clair.
// Cette vérification doit rester strictement identique à celle de l'outil admin
// (index.html) puisque les deux applications partagent le même stockage de comptes.
function bufferToHex_(buffer){
  return Array.from(new Uint8Array(buffer)).map(b => b.toString(16).padStart(2, '0')).join('');
}
function hexToBuffer_(hex){
  const bytes = new Uint8Array(hex.length / 2);
  for (let i = 0; i < hex.length; i += 2) bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
  return bytes;
}
async function derivePasswordHash_(password, saltHex){
  const keyMaterial = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(password), { name: 'PBKDF2' }, false, ['deriveBits']
  );
  const bits = await crypto.subtle.deriveBits(
    { name: 'PBKDF2', salt: hexToBuffer_(saltHex), iterations: 100000, hash: 'SHA-256' },
    keyMaterial,
    256
  );
  return bufferToHex_(bits);
}
function timingSafeEqualStr_(a, b){
  if (typeof a !== 'string' || typeof b !== 'string' || a.length !== b.length) return false;
  let diff = 0;
  for (let i = 0; i < a.length; i++) diff |= a.charCodeAt(i) ^ b.charCodeAt(i);
  return diff === 0;
}
async function verifyPassword_(password, account){
  if (!account) return false;
  if (account.password !== undefined && account.password !== null){
    return timingSafeEqualStr_(String(password), String(account.password));
  }
  if (!account.salt || !account.passwordHash) return false;
  const computedHash = await derivePasswordHash_(password, account.salt);
  return timingSafeEqualStr_(computedHash, account.passwordHash);
}

// ===================== Comptes & session (identique à l'outil principal) =====================
const DEFAULT_ACCOUNTS = [
  { login: "admin", password: "Qualite@2026", role: "admin", name: "Administrateur" },
  { login: "Tahina", password: "zLkcpNmsLG", role: "user", name: "Tahina" },
  { login: "Tahiry", password: "WiIBpGI78o", role: "user", name: "Tahiry" },
  { login: "Martinah", password: "kc88Llkq2N", role: "user", name: "Martinah" },
  { login: "Hasina", password: "10uKHwVfXB", role: "user", name: "Hasina" },
  { login: "Ravaka", password: "cMNj18iR7r", role: "user", name: "Ravaka" },
  { login: "Rita", password: "eFhsHiPxsA", role: "user", name: "Rita" },
  { login: "Katie", password: "OeUNYw9n9x", role: "user", name: "Katie" },
  { login: "Voahanginiaina", password: "TXAlMXQBhh", role: "user", name: "Voahanginiaina" },
  { login: "Iary", password: "epKOgcHajm", role: "user", name: "Iary" }
];
let ACCOUNTS = [];
let accountsReady = null;
let accountsLoadError = false;

const API_URL =
"https://script.google.com/macros/s/AKfycbxb--b5F7efYYt9FxheDanlqMeIGeyz_wyX1voqLKGkkua3tKIofTIEq6NSaYsNPn1D8A/exec";

async function safeGet(key, shared) {
  try {
    const response = await fetch(`${API_URL}?key=${encodeURIComponent(key)}`);
    if (!response.ok) return null;
    return await response.json();
  } catch (err) {
    console.error('safeGet error:', err);
    return null;
  }
}
async function safeSet(key, value) {
  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "save", key: key, value: value })
    });
    return await response.json();
  } catch (err) {
    console.error('safeSet error:', err);
    return null;
  }
}

async function fetchAccountsFromServer(){
  try {
    const response = await fetch(`${API_URL}?key=accounts`);
    if (!response.ok) return { ok: false, data: null };
    const data = await response.json();
    return { ok: true, data };
  } catch (err) {
    console.error('fetchAccountsFromServer error:', err);
    return { ok: false, data: null };
  }
}

async function loadAccounts(){
  const result = await fetchAccountsFromServer();
  if (result.ok){
    if (Array.isArray(result.data) && result.data.length){
      ACCOUNTS = result.data;
    } else {
      ACCOUNTS = DEFAULT_ACCOUNTS;
      await safeSet('accounts', ACCOUNTS, true);
    }
  } else {
    ACCOUNTS = [];
    accountsLoadError = true;
    console.warn("Impossible de charger les comptes depuis le serveur.");
  }
  return ACCOUNTS;
}
async function ensureAccountsLoaded(){
  if (!accountsReady) accountsReady = loadAccounts();
  return accountsReady;
}

async function saveAccounts(){
  await safeSet('accounts', ACCOUNTS, true);
}
function genPassword(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
  let p = '';
  for (let i = 0; i < 10; i++) p += chars[Math.floor(Math.random()*chars.length)];
  return p;
}

let currentUser = null;

const SESSION_KEY = 'geq_agent_session';
function saveLocalSession(login){
  try { localStorage.setItem(SESSION_KEY, JSON.stringify({ login })); } catch (err) {}
}
function readLocalSession(){
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (err) { return null; }
}
function clearLocalSession(){
  try { localStorage.removeItem(SESSION_KEY); } catch (err) {}
}

async function attemptLogin(){
  await ensureAccountsLoaded();
  const login = document.getElementById('loginInput').value.trim();
  const pwd = document.getElementById('passwordInput').value;
  const errEl = document.getElementById('loginError');
  const candidate = ACCOUNTS.find(a => a.login.toLowerCase() === login.toLowerCase());
  const valid = candidate ? await verifyPassword_(pwd, candidate) : false;
  const acc = valid ? candidate : null;
  if (!acc){
    errEl.textContent = accountsLoadError
      ? "Connexion au serveur impossible pour vérifier les comptes. Vérifiez votre connexion et réessayez."
      : "Identifiant ou mot de passe incorrect.";
    return;
  }
  currentUser = acc;
  saveLocalSession(acc.login);
  document.getElementById('loginOverlay').style.display = 'none';
  document.getElementById('appWrap').style.display = 'block';
  await afterLogin();
}
document.getElementById('loginBtn').addEventListener('click', attemptLogin);
document.getElementById('passwordInput').addEventListener('keydown', e => { if (e.key === 'Enter') attemptLogin(); });
document.getElementById('logoutBtn').addEventListener('click', () => {
  currentUser = null;
  clearLocalSession();
  document.getElementById('appWrap').style.display = 'none';
  document.getElementById('loginOverlay').style.display = 'flex';
  document.getElementById('loginInput').value = '';
  document.getElementById('passwordInput').value = '';
  document.getElementById('loginError').textContent = '';
});

async function restoreSession(){
  await ensureAccountsLoaded();
  const sess = readLocalSession();
  if (sess){
    const acc = ACCOUNTS.find(a => a.login === sess.login);
    if (acc){
      currentUser = acc;
      document.getElementById('loginOverlay').style.display = 'none';
      document.getElementById('appWrap').style.display = 'block';
      await afterLogin();
      return;
    }
  }
  document.getElementById('loginOverlay').style.display = 'flex';
  document.getElementById('appWrap').style.display = 'none';
  if (accountsLoadError){
    document.getElementById('loginError').textContent =
      "Connexion au serveur impossible. Vérifiez votre connexion et réessayez.";
  }
}

// ===================== Critères (identiques à l'outil principal) =====================
const CRITERIA = [
  { id: "accueil", titre: "Accueil", detail: "Salutation, ton professionnel, remerciement, disponibilité et prise en charge de la demande." },
  { id: "ecoute", titre: "Écoute", detail: "Reformulation de la demande, prise en compte du contexte, réponse non standardisée." },
  { id: "comprehension", titre: "Compréhension du vécu client", detail: "Identification de l'émotion exprimée, reconnaissance du ressenti, traitement de l'émotion avant la solution." },
  { id: "emotion", titre: "Reconnaissance de l'émotion", detail: "Explication simple, étapes décomposées, vulgarisation, absence de jargon technique." },
  { id: "pedagogie", titre: "Pédagogie", detail: "Dialogue humain, écoute active, posture d'accompagnement, démarche collaborative." },
  { id: "personnalisation", titre: "Personnalisation", detail: "Gestion des critiques/réclamations, calme, recherche de solutions, respect mutuel." },
  { id: "tensions", titre: "Gestion des tensions", detail: "Accueil, écoute, compréhension, accompagnement, clarté et professionnalisme dans les verbatims." },
  { id: "cloture", titre: "Clôture", detail: "Synthèse claire, piliers de la relation client, réponse personnalisée, exemple concret." },
  { id: "pertinence", titre: "Pertinence de la réponse / Amabilité / Sourire / Humanité & Bienveillance", detail: "Solution correcte, complète et précise ; amabilité, dynamisme et considération." }
];

async function getAllEvaluations(){
  const index = (await safeGet('evaluations_index', true)) || [];
  const full = await Promise.all(index.map(async row => {
    const rec = await safeGet('eval:' + row.id, true);
    return rec || row;
  }));
  return full.filter(Boolean).sort((a,b) => b.savedAt - a.savedAt);
}

function scoreColor(pct){
  if (pct === null || pct === undefined) return { color:'var(--na)', bg:'var(--na-bg)' };
  if (pct >= 80) return { color:'var(--conforme)', bg:'var(--conforme-bg)' };
  if (pct >= 50) return { color:'var(--warn)', bg:'var(--warn-bg)' };
  return { color:'var(--nonconforme)', bg:'var(--nonconforme-bg)' };
}

function drawGauge(pct){
  const hasScore = pct !== null && pct !== undefined;
  const value = hasScore ? Math.round(pct) : 0;
  const r = 58, c = 2*Math.PI*r;
  const offset = c - (value/100)*c;
  const color = !hasScore ? '#5b7d76' : value >= 80 ? '#5fd6a0' : value >= 50 ? '#f2c14e' : '#e8837a';
  return `
    <svg viewBox="0 0 140 140" width="140" height="140">
      <circle cx="70" cy="70" r="${r}" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="11"/>
      <circle cx="70" cy="70" r="${r}" fill="none" stroke="${color}" stroke-width="11"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}"
        transform="rotate(-90 70 70)" style="transition: stroke-dashoffset .3s ease"/>
      <text x="70" y="77" text-anchor="middle" font-family="Fraunces, serif" font-size="28" font-weight="600" fill="#fff">${hasScore ? value + '%' : '—'}</text>
    </svg>`;
}

// ---- Découpage en semaines (lundi -> dimanche), 4 dernières semaines ----
function mondayOf(d){
  const dt = new Date(d);
  const day = dt.getDay(); // 0 = dimanche
  const diff = (day === 0 ? -6 : 1) - day;
  dt.setDate(dt.getDate() + diff);
  dt.setHours(0,0,0,0);
  return dt;
}
function fmtDate(d){
  return d.toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit' });
}

function buildWeeklyEvolution(evals){
  const thisMonday = mondayOf(new Date());
  const weeks = [];
  for (let i = 3; i >= 0; i--){
    const start = new Date(thisMonday);
    start.setDate(start.getDate() - i*7);
    const end = new Date(start);
    end.setDate(end.getDate() + 6);
    weeks.push({ start, end, label: `${fmtDate(start)} – ${fmtDate(end)}` });
  }
  return weeks.map(w => {
    const startStr = w.start.toISOString().slice(0,10);
    const endStr = w.end.toISOString().slice(0,10);
    const inWeek = evals.filter(e => e.date && e.date >= startStr && e.date <= endStr);
    const scored = inWeek.filter(e => e.finalPct !== undefined && e.finalPct !== null);
    const avg = scored.length ? scored.reduce((s,e) => s + e.finalPct, 0) / scored.length : null;
    return { ...w, avg, count: inWeek.length };
  });
}

function renderWeeklyChart(weeks){
  const barsHtml = weeks.map(w => {
    const hasVal = w.avg !== null;
    const heightPct = hasVal ? Math.max(6, Math.round(w.avg)) : 0;
    const sc = hasVal ? (w.avg >= 80 ? '#2f8f5e' : w.avg >= 50 ? '#b5860b' : '#b3423a') : 'var(--na)';
    return `
      <div class="week-bar-col">
        <div class="week-bar-value">${hasVal ? Math.round(w.avg) + '%' : '—'}</div>
        <div class="week-bar-track">
          <div class="week-bar-fill" style="height:${heightPct}%; background:${sc};"></div>
        </div>
        <div class="week-bar-label">${w.label}</div>
        <div class="week-bar-count">${w.count} éval.${w.count>1?'s':''}</div>
      </div>`;
  }).join('');

  const scoredWeeks = weeks.filter(w => w.avg !== null);
  let trendHtml = '<div class="trend-line">Pas assez de données sur la période pour dégager une tendance.</div>';
  if (scoredWeeks.length >= 2){
    const first = scoredWeeks[0].avg;
    const last = scoredWeeks[scoredWeeks.length - 1].avg;
    const delta = last - first;
    const cls = delta > 1 ? 'trend-up' : delta < -1 ? 'trend-down' : 'trend-flat';
    const arrow = delta > 1 ? '↗' : delta < -1 ? '↘' : '→';
    trendHtml = `<div class="trend-line">Tendance sur la période : <span class="${cls}">${arrow} ${delta >= 0 ? '+' : ''}${Math.round(delta)} pts</span></div>`;
  }

  return `
    <div class="chart-wrap">
      <div class="week-bars">${barsHtml}</div>
    </div>
    ${trendHtml}`;
}

function computeNonConformityRates(evals){
  const tally = {}; // { critere: { nc: n, total: n } }
  CRITERIA.forEach(c => tally[c.titre] = { nc: 0, total: 0 });
  evals.forEach(e => (e.details || []).forEach(d => {
    if (!tally[d.critere]) tally[d.critere] = { nc: 0, total: 0 };
    if (d.statut === 'conforme' || d.statut === 'nonconforme'){
      tally[d.critere].total++;
      if (d.statut === 'nonconforme') tally[d.critere].nc++;
    }
  }));
  return Object.entries(tally)
    .filter(([, v]) => v.total > 0)
    .map(([critere, v]) => ({ critere, rate: (v.nc / v.total) * 100, nc: v.nc, total: v.total }))
    .sort((a, b) => b.rate - a.rate);
}

function renderNonConformity(rows){
  if (!rows.length){
    return '<div class="empty-state">Aucune évaluation avec critères renseignés pour le moment.</div>';
  }
  return rows.map((r, i) => `
    <div class="noncomp-row">
      <span class="noncomp-rank">${i+1}</span>
      <span class="noncomp-name">${r.critere}</span>
      <div class="noncomp-track"><div class="noncomp-fill" style="width:${Math.round(r.rate)}%"></div></div>
      <span class="noncomp-pct">${Math.round(r.rate)}%</span>
      <span class="noncomp-n">${r.nc}/${r.total}</span>
    </div>`).join('');
}

// ===================== Historique cliquable & signature électronique =====================
function renderHistorySection(myEvals){
  if (!myEvals.length){
    return '<div class="empty-state">Aucune évaluation enregistrée pour le moment.</div>';
  }
  return `
    <table>
      <thead><tr>
        <th>Date</th><th>Évaluateur</th><th>File</th><th>Note</th><th>Débrief</th>
      </tr></thead>
      <tbody>
        ${myEvals.map(row => {
          const pct = row.finalPct !== undefined ? row.finalPct : row.pct;
          const label = (pct === null || pct === undefined) ? '—' : Math.round(pct) + '%';
          const sc = scoreColor(pct);
          const signed = !!row.signature;
          return `<tr class="eval-row" data-open-eval="${row.id}">
            <td>${row.date || '—'}</td>
            <td>${row.evaluateur || '—'}</td>
            <td>${row.file || '—'}</td>
            <td><span class="pill-score" style="color:${sc.color}; background:${sc.bg}">${label}</span></td>
            <td><span class="sig-badge ${signed ? 'sig-signed' : 'sig-pending'}">${signed ? '✓ Signé' : 'En attente'}</span></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
}

function bindHistoryEvents(){
  document.querySelectorAll('[data-open-eval]').forEach(row => {
    row.addEventListener('click', () => openEvalDetail(row.getAttribute('data-open-eval')));
  });
}

function fmtDateTime(ts){
  if (!ts) return '—';
  const d = new Date(ts);
  return d.toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric' }) +
    ' à ' + d.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
}

function statusLabel(statut){
  if (statut === 'conforme') return { txt:'Conforme', cls:'crit-status-conforme' };
  if (statut === 'nonconforme') return { txt:'Non conforme', cls:'crit-status-nonconforme' };
  return { txt:'N/A', cls:'crit-status-na' };
}

async function openEvalDetail(id){
  const overlay = document.getElementById('evalModalOverlay');
  const content = document.getElementById('evalModalContent');
  content.innerHTML = '<div class="empty-state">Chargement…</div>';
  overlay.style.display = 'flex';

  const rec = (await safeGet('eval:' + id, true)) || allEvals.find(e => e.id === id);
  currentModalEval = rec;
  renderEvalModal();
}

function closeEvalDetail(){
  document.getElementById('evalModalOverlay').style.display = 'none';
  currentModalEval = null;
}
document.getElementById('evalModalOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'evalModalOverlay') closeEvalDetail();
});

function renderEvalModal(){
  const content = document.getElementById('evalModalContent');
  const rec = currentModalEval;
  if (!rec){
    content.innerHTML = '<div class="empty-state">Évaluation introuvable.</div>';
    return;
  }
  const pct = rec.finalPct !== undefined ? rec.finalPct : rec.pct;
  const sc = scoreColor(pct);
  const detailsByCrit = {};
  (rec.details || []).forEach(d => { detailsByCrit[d.critere] = d.statut; });

  content.innerHTML = `
    <div class="modal-head">
      <div>
        <h2>Évaluation du ${rec.date || '—'}</h2>
        <div class="modal-sub">Évaluateur : ${rec.evaluateur || '—'} · File ${rec.file || '—'} · ${rec.ecoute || '—'}</div>
      </div>
      <button class="modal-close" id="closeEvalModalBtn">✕</button>
    </div>

    <div class="modal-meta-grid">
      <div><span>Agent : </span>${rec.agent || '—'}</div>
      <div><span>Note : </span><span class="pill-score" style="color:${sc.color}; background:${sc.bg}">${pct !== null && pct !== undefined ? Math.round(pct)+'%' : '—'}</span></div>
      <div><span>Demande client : </span>${rec.demande || '—'}</div>
      <div><span>Typologie : </span>${rec.typologie || '—'}</div>
      <div><span>Indice : </span>${rec.indice || '—'}</div>
      <div><span>Situation inacceptable : </span>${rec.hasSI ? 'Oui (pénalité 50 %)' : 'Non'}</div>
    </div>

    <div>
      ${CRITERIA.map(c => {
        const statut = detailsByCrit[c.titre];
        const s = statusLabel(statut);
        return `
          <div class="crit-detail-row">
            <div>
              <div style="font-weight:600;">${c.titre}</div>
              <div style="color:var(--ink-soft); font-size:12px; margin-top:2px;">${c.detail}</div>
            </div>
            <span class="crit-status-tag ${s.cls}">${s.txt}</span>
          </div>`;
      }).join('')}
    </div>

    <div class="sig-box" id="sigBox"></div>
  `;
  document.getElementById('closeEvalModalBtn').addEventListener('click', closeEvalDetail);
  renderSignatureBox();
}

function renderSignatureBox(){
  const box = document.getElementById('sigBox');
  const rec = currentModalEval;
  if (!box || !rec) return;

  if (rec.signature){
    box.innerHTML = `
      <h3>Signature électronique</h3>
      <div class="sig-confirmed">✓ Signé par ${rec.signature.signedByName || rec.signature.signedBy} le ${fmtDateTime(rec.signature.signedAt)}</div>
      <p style="margin-top:8px;">Cette évaluation a été validée par l'agent comme engagement et traçabilité du débrief.</p>
    `;
    return;
  }

  const isOwner = currentUser && (rec.agent || '').trim().toLowerCase() === currentUser.name.trim().toLowerCase();
  if (!isOwner){
    box.innerHTML = `
      <h3>Signature électronique</h3>
      <p class="sig-readonly-note">En attente de signature. Seul l'agent concerné (${rec.agent || '—'}) peut signer cette évaluation avec son mot de passe.</p>
    `;
    return;
  }

  box.innerHTML = `
    <h3>Signature électronique</h3>
    <p>En saisissant votre mot de passe, vous confirmez avoir pris connaissance de cette évaluation et échangé
    avec votre évaluateur lors du débrief. Cette action fait office d'engagement et est tracée (identifiant, date et heure).</p>
    <div class="sig-form-row">
      <input type="password" id="sigPasswordField" placeholder="Votre mot de passe">
      <button class="btn-primary" id="sigConfirmBtn">Signer électroniquement</button>
    </div>
    <div class="sig-error" id="sigError"></div>
  `;
  const field = document.getElementById('sigPasswordField');
  field.addEventListener('keydown', e => { if (e.key === 'Enter') confirmSignature(); });
  document.getElementById('sigConfirmBtn').addEventListener('click', confirmSignature);
}

async function confirmSignature(){
  const field = document.getElementById('sigPasswordField');
  const errEl = document.getElementById('sigError');
  const pwd = field ? field.value : '';
  if (!pwd){
    errEl.textContent = 'Merci de saisir votre mot de passe.';
    return;
  }
  if (pwd !== currentUser.password){
    errEl.textContent = 'Mot de passe incorrect. La signature n\'a pas été enregistrée.';
    return;
  }

  const btn = document.getElementById('sigConfirmBtn');
  if (btn) btn.disabled = true;
  errEl.textContent = '';

  // On relit l'enregistrement le plus récent avant d'écrire, pour ne pas écraser
  // une évaluation modifiée entre-temps par un évaluateur/administrateur.
  const fresh = (await safeGet('eval:' + currentModalEval.id, true)) || currentModalEval;
  fresh.signature = {
    signedBy: currentUser.login,
    signedByName: currentUser.name,
    signedAt: Date.now()
  };
  await safeSet('eval:' + fresh.id, fresh, true);

  currentModalEval = fresh;
  const idx = allEvals.findIndex(e => e.id === fresh.id);
  if (idx !== -1) allEvals[idx] = fresh;

  renderEvalModal();
  renderContent();
}

// ===================== Rendu principal =====================
let allEvals = [];
let selectedAgent = null;
let editingOwnPassword = false;
let currentModalEval = null;
// Pour un compte admin : détermine si l'espace affiche uniquement le compte de l'admin
// ("user", comme n'importe quel agent) ou permet de choisir n'importe quel agent ("agent").
let adminViewMode = 'agent';

function renderAccessCard(){
  if (!currentUser) return '';
  return `
    <div class="section card">
      <h2 class="section-title">Mon accès</h2>
      <div class="access-row">
        <div class="access-item">
          <span class="access-label">Identifiant</span>
          <span class="access-value">${currentUser.login}</span>
        </div>
        <div class="access-item" id="pwdDisplayBlock">
          ${editingOwnPassword ? `
            <span class="access-label">Nouveau mot de passe électronique</span>
            <div class="pwd-edit-row">
              <input type="text" id="ownPwdField" value="${currentUser.password}">
              <button class="btn-primary btn-small" id="saveOwnPwdBtn">Enregistrer</button>
              <button class="btn-ghost btn-small" id="genOwnPwdBtn">Générer</button>
              <button class="btn-ghost btn-small" id="cancelOwnPwdBtn">Annuler</button>
            </div>
          ` : `
            <span class="access-label">Mot de passe électronique</span>
            <span class="access-value">${currentUser.password}</span>
          `}
        </div>
        ${editingOwnPassword ? '' : '<button class="btn-ghost btn-small" id="editOwnPwdBtn">Modifier le mot de passe</button>'}
      </div>
      <p style="font-size:12px; color:var(--ink-soft); margin:12px 0 0;">
        Ce mot de passe est également visible et modifiable par un administrateur depuis « Gérer les comptes ».
      </p>
      <div class="save-status" id="ownPwdStatus"></div>
    </div>`;
}

function bindAccessCardEvents(){
  const editBtn = document.getElementById('editOwnPwdBtn');
  if (editBtn) editBtn.addEventListener('click', () => { editingOwnPassword = true; renderContent(); });

  const cancelBtn = document.getElementById('cancelOwnPwdBtn');
  if (cancelBtn) cancelBtn.addEventListener('click', () => { editingOwnPassword = false; renderContent(); });

  const genBtn = document.getElementById('genOwnPwdBtn');
  if (genBtn) genBtn.addEventListener('click', () => {
    const field = document.getElementById('ownPwdField');
    if (field) field.value = genPassword();
  });

  const saveBtn = document.getElementById('saveOwnPwdBtn');
  if (saveBtn) saveBtn.addEventListener('click', async () => {
    const field = document.getElementById('ownPwdField');
    const statusEl = document.getElementById('ownPwdStatus');
    const newPwd = field ? field.value.trim() : '';
    if (!newPwd){
      statusEl.textContent = 'Merci de saisir un mot de passe.';
      statusEl.style.color = 'var(--nonconforme)';
      return;
    }
    const acc = ACCOUNTS.find(a => a.login === currentUser.login);
    if (acc){
      acc.password = newPwd;
      await saveAccounts();
      currentUser = acc;
      saveLocalSession(acc.login);
    }
    editingOwnPassword = false;
    renderContent();
  });
}

function applyAdminViewMode(){
  const agentSet = [...new Set(allEvals.map(e => e.agent).filter(Boolean))].sort();
  const pickerRow = document.getElementById('agentPickerRow');
  const picker = document.getElementById('agentPicker');

  document.getElementById('modeUserBtn').classList.toggle('mode-active', adminViewMode === 'user');
  document.getElementById('modeAgentBtn').classList.toggle('mode-active', adminViewMode === 'agent');

  if (adminViewMode === 'user'){
    // Vue « Utilisateur » : l'admin voit son propre espace, comme n'importe quel agent.
    selectedAgent = currentUser.name;
    pickerRow.style.display = 'none';
  } else {
    // Vue « Agent » : l'admin choisit librement l'agent dont il consulte les évaluations.
    picker.innerHTML = agentSet.map(a => `<option value="${a}">${a}</option>`).join('');
    selectedAgent = agentSet.includes(selectedAgent) ? selectedAgent : (agentSet.includes(currentUser.name) ? currentUser.name : (agentSet[0] || null));
    picker.value = selectedAgent || '';
    pickerRow.style.display = agentSet.length ? 'flex' : 'none';
    picker.onchange = () => { selectedAgent = picker.value; renderContent(); };
  }
}

async function afterLogin(){
  document.getElementById('sessionInfo').innerHTML = `Connecté : <b>${currentUser.name}</b>`;
  allEvals = await getAllEvaluations();

  // Un admin peut choisir de voir sa propre vue ("Utilisateur") ou celle de n'importe quel
  // agent ("Agent") ; un utilisateur standard voit uniquement ses propres évaluations.
  const modeRow = document.getElementById('adminModeRow');
  const pickerRow = document.getElementById('agentPickerRow');
  if (currentUser.role === 'admin'){
    modeRow.style.display = 'flex';
    document.getElementById('modeUserBtn').onclick = () => { adminViewMode = 'user'; applyAdminViewMode(); renderContent(); };
    document.getElementById('modeAgentBtn').onclick = () => { adminViewMode = 'agent'; applyAdminViewMode(); renderContent(); };
    applyAdminViewMode();
  } else {
    modeRow.style.display = 'none';
    selectedAgent = currentUser.name;
    pickerRow.style.display = 'none';
  }
  renderContent();
}

function renderContent(){
  const container = document.getElementById('content');
  if (!selectedAgent){
    container.innerHTML = '<div class="card empty-state">Aucune évaluation trouvée pour votre compte pour le moment.</div>';
    return;
  }

  const myEvals = allEvals.filter(e => (e.agent || '').trim().toLowerCase() === selectedAgent.trim().toLowerCase());
  const scored = myEvals.filter(e => e.finalPct !== undefined && e.finalPct !== null);
  const globalAvg = scored.length ? scored.reduce((s,e) => s + e.finalPct, 0) / scored.length : null;
  const siCount = myEvals.filter(e => e.hasSI).length;

  const weeks = buildWeeklyEvolution(myEvals);
  const ncRows = computeNonConformityRates(myEvals);

  container.innerHTML = `
    <div class="top-grid">
      <div class="score-panel">
        <div class="label">Note qualité globale</div>
        <div class="gauge-wrap">${drawGauge(globalAvg)}</div>
        <div class="gauge-sub">${myEvals.length} évaluation${myEvals.length>1?'s':''} au total</div>
      </div>
      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-label">Agent</div>
          <div class="stat-value" style="font-size:19px;">${selectedAgent}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Évaluations (4 sem.)</div>
          <div class="stat-value">${weeks.reduce((s,w)=>s+w.count,0)}</div>
          <div class="stat-sub">sur les 4 dernières semaines</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Situations inacceptables</div>
          <div class="stat-value" style="color:${siCount ? 'var(--nonconforme)' : 'var(--primary-dark)'}">${siCount}</div>
          <div class="stat-sub">au total</div>
        </div>
      </div>
    </div>

    <div class="section card">
      <h2 class="section-title">Évolution sur 4 semaines</h2>
      ${renderWeeklyChart(weeks)}
    </div>

    <div class="section card">
      <h2 class="section-title">Taux de non-conformité par critère (ordre décroissant)</h2>
      ${renderNonConformity(ncRows)}
    </div>

    <div class="section card">
      <h2 class="section-title">Mes évaluations — débrief &amp; signature</h2>
      <p style="font-size:12.5px; color:var(--ink-soft); margin:-6px 0 14px;">Cliquez sur une évaluation pour consulter le détail et, le cas échéant, la signer électroniquement.</p>
      ${renderHistorySection(myEvals)}
    </div>

    ${renderAccessCard()}
  `;
  bindAccessCardEvents();
  bindHistoryEvents();
}

restoreSession();
</script>
